{% extends "base.html" %}
{% block title %}Create Event{% endblock %}
{% block content %}
<div class="page-title"><div><p class="eyebrow">NEW EVENT</p><h1>Create an event</h1><p>Enter the basic event details first. You can add worker jobs and guests after saving.</p></div></div>
<form class="form card wide" method="post">
<div class="grid2"><label>Event name<input name="name" required placeholder="Rahul & Priya Wedding"></label><label>Event type<select name="event_type"><option>Wedding</option><option>Birthday</option><option>Engagement</option><option>College Event</option><option>Corporate</option><option>Other</option></select></label></div>
<div class="grid2"><label>Date<input type="date" name="event_date"></label><label>Time<input type="time" name="event_time"></label></div>
<div class="grid2"><label>Venue<input name="venue" placeholder="Convention Hall"></label><label>Location<input name="location" placeholder="Mangalore"></label></div>
<div class="grid2"><label>Expected guests<input type="number" name="guests" min="0"></label><label>Budget (₹)<input type="number" name="budget" min="0"></label></div>
<label>Description<textarea name="description" rows="4" placeholder="Tell workers/caterers about the event..."></textarea></label>
<button class="btn">Create event</button>
</form>
{% endblock %}
